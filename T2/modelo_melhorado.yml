# T2 - assistência técnica (modelo hipotético), cenário melhorado.
# Única mudança em relação a modelo_inicial.yml: Q2 (reparo) passa de 1 para 2 servidores.
# Capacidade de Q2 permanece 8. Tempos em minutos.
simulation:
  randoms: 1000000
  seed: 42

queues:
  Q1:
    servers: 1
    capacity: 5
    service: [2.0, 4.0]
    external_arrival: [5.0, 7.0]
    first_arrival: 6.0
  Q2:
    servers: 2
    capacity: 8
    service: [6.0, 10.0]
  Q3:
    servers: 1
    capacity: 5
    service: [2.0, 4.0]

routes:
  Q1:
    - to: Q2
      probability: 1.0
  Q2:
    - to: Q3
      probability: 1.0
  Q3:
    - to: Q2
      probability: 0.2
